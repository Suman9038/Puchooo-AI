services:
  # ============================================================================
  # 1. Puchooo AI Backend + Celery Worker (Supervisord)
  # Uses Native Host Ollama for LLM + FastEmbed (ONNX, Zero PyTorch) for Embeddings
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: puchooo-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - PORT=8000
      - APP_ENV=production
      - PRIMARY_LLM=groq
      - GROQ_MODEL=llama-3.3-70b-versatile
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_HOST=http://127.0.0.1:11434
      - EMBEDDING_PROVIDER=fastembed
      - FASTEMBED_MODEL=sentence-transformers/paraphrase-multilingual-mpnet-base-v2
      - EMBEDDING_DIMENSION=768
      - EMBEDDING_THREADS=4
      - FASTEMBED_CACHE_PATH=/app/.embeddings/.cache
      - OLLAMA_MODEL=hf.co/unsloth/Qwen3.5-4B-GGUF:Q4_K_M
    volumes:
      - /root/.cache/embeddings:/app/.embeddings/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 60s
      timeout: 30s
      start_period: 60s
      retries: 5
