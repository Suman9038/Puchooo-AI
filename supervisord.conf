[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[program:uvicorn]
command=sh -c "exec /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000} --log-level info"
priority=1
startsecs=2
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:celery]
command=/app/.venv/bin/celery -A app.worker.celery.celery_app worker --loglevel=info --pool=solo
priority=10
startsecs=3
environment=C_FORCE_ROOT="true"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
