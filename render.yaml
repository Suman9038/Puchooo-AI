services:
  - type: web
    name: puchooo-ai-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: EMBEDDING_PROVIDER
        value: google
      - key: QDRANT_COLLECTION
        value: Puchooo_AI
      - key: EMBEDDING_DIMENSION
        value: "768"
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_FROM_NAME
        value: "Puchooo AI"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_SSL_TLS
        value: "false"
      # Sensitive secrets configured in Render Dashboard (sync: false)
      - key: LOCAL_DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: LOCAL_REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: VERIFICATION_URL
        sync: false

